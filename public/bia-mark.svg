<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="BIA logo mark">
  <defs>
    <clipPath id="pin">
      <path d="M256 456 C256 456 124 330 124 204 A132 132 0 0 1 388 204 C388 330 256 456 256 456Z"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="120" fill="#0E1A16"/>

  <!-- pin sliced into diagonal tricolor bands -->
  <g clip-path="url(#pin)">
    <g transform="rotate(32 256 260)">
      <rect x="40" y="-200" width="176" height="1000" fill="#F77F00"/>
      <rect x="226" y="-200" width="60" height="1000" fill="#FFFFFF"/>
      <rect x="296" y="-200" width="176" height="1000" fill="#009E60"/>
    </g>
  </g>

  <!-- sun window -->
  <circle cx="256" cy="206" r="58" fill="#0E1A16"/>
  <path d="M214 226 A42 42 0 0 1 298 226Z" fill="#F77F00"/>
  <line x1="214" y1="226" x2="298" y2="226" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <line x1="228" y1="242" x2="284" y2="242" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
</svg>
